name: Platform Frontend dev CI

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{steps.meta.outputs.tag}}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push frontend image
      id: meta
      run: |
        TAG=${{github.sha}}
        docker build -t shane25225/platform-frontend:$TAG frontend
        docker push shane25225/platform-frontend:$TAG

        echo "TAG=$TAG" >> $GITHUB_ENV
    
    - name: Checkout cluster-config
      uses: actions/checkout@v4
      with:
        repository: thecrusader25225/cluster-config
        token: ${{ secrets.GH_PAT }}
        path: cluster-config
    
    - name: Update dev kustomization
      run: | 
        cd cluster-config
        yq e -i ".images[0].newTag = \"${TAG}\"" apps/platform/frontend/overlays/dev/kustomization.yml
    
    - name: Commit and Push Update
      run: |
        cd cluster-config
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add apps/platform/frontend/overlays/dev/kustomization.yml
        git commit -m "Deploy(dev) platform-frontend:${TAG}"
        git push https://x-access-token:${GH_PAT}@github.com/thecrusader25225/cluster-config.git main
      env:
        GH_PAT: ${{secrets.GH_PAT}}